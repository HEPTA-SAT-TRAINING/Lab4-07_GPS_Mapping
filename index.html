<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab4-10 GPS Mapping</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="actions"><span id="status" class="status"><i></i>Disconnected</span><button id="connect">Connect XBee</button></div></header>
  <main>
    <section class="split"><article class="panel raw-panel"><div class="panel-head"><h2>Raw data</h2><button id="clearRaw" class="quiet">Clear</button></div><pre id="rawLog" aria-label="Raw NMEA string">Waiting for NMEA data...</pre><div class="raw-footer"><span id="rawCount">0 lines</span></div></article><article class="panel map-panel"><div class="panel-head"><h2>Map</h2><span id="pointCount">0 points</span></div><div id="map"></div><div class="map-footer"><span>Latest: <b id="latest">--:--:--</b></span><span>OpenStreetMap / Leaflet</span></div></article></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script>
</body>
</html>
