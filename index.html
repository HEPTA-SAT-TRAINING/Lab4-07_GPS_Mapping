<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab4-07 GPS Mapping</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="actions"><button id="connect">Select USB / XBee Port</button><span id="status" class="status"><i></i>Disconnected</span><button id="saveLog" class="secondary">Save Processed Log</button></div></header>
  <main>
    <section class="split"><article class="panel raw-panel"><div class="panel-head"><h2>Processed GPS Data</h2><div class="raw-actions"><label class="autoscroll"><input id="autoScroll" type="checkbox" checked> Auto-scroll</label><button id="clearRaw" class="quiet">Clear</button></div></div><pre id="processedLog" aria-label="Processed GPS data">Waiting for processed GPS data...</pre></article><article class="panel map-panel"><div class="panel-head"><h2>GPS Status &amp; Map</h2></div><div class="telemetry" aria-label="GPS status table"><div class="telemetry-cell"><span>Fix Status</span><b id="telemetry-fix" class="telemetry-value is-waiting">No Fix</b></div><div class="telemetry-cell"><span>Satellites Used</span><b id="telemetry-satellitesUsed">--</b></div><div class="telemetry-cell"><span>Satellites in View</span><b id="telemetry-satellitesInView">--</b></div><div class="telemetry-cell"><span>Latitude</span><b id="telemetry-latitude">--</b></div><div class="telemetry-cell"><span>Longitude</span><b id="telemetry-longitude">--</b></div><div class="telemetry-cell"><span>Altitude</span><b id="telemetry-altitude">--</b></div><div class="telemetry-cell"><span>Speed</span><b id="telemetry-speed">--</b></div><div class="telemetry-cell"><span>Heading</span><b id="telemetry-heading">--</b></div><div class="telemetry-cell"><span>HDOP</span><b id="telemetry-hdop">--</b></div><div class="telemetry-cell"><span>UTC Time</span><b id="telemetry-timestamp">--:--:--</b></div></div><h2 class="map-title">Track Map</h2><div id="map"></div><div class="map-footer"><span>OpenStreetMap / OpenFreeMap / Leaflet</span></div></article></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
