<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab4-10 GPS Mapping</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="actions"><span id="status" class="status"><i></i>Disconnected</span><button id="connect">Connect XBee</button></div></header>
  <main>
    <section class="split"><article class="panel raw-panel"><div class="panel-head"><h2>Raw data</h2><div class="raw-actions"><label class="autoscroll"><input id="autoScroll" type="checkbox" checked> Auto-scroll</label><button id="clearRaw" class="quiet">Clear</button></div></div><pre id="rawLog" aria-label="Raw NMEA string">Waiting for NMEA data...</pre><div class="raw-footer"><span id="rawCount">0 lines</span></div></article><article class="panel map-panel"><div class="panel-head"><h2>Map</h2><span id="pointCount">0 points</span></div><div class="telemetry" aria-label="GPS status table"><div class="telemetry-cell"><span>測位状態</span><b id="telemetry-fix" class="telemetry-value is-waiting">未測位</b></div><div class="telemetry-cell"><span>使用衛星数</span><b id="telemetry-satellitesUsed">--</b></div><div class="telemetry-cell"><span>捕捉衛星数</span><b id="telemetry-satellitesInView">--</b></div><div class="telemetry-cell"><span>緯度</span><b id="telemetry-latitude">--</b></div><div class="telemetry-cell"><span>経度</span><b id="telemetry-longitude">--</b></div><div class="telemetry-cell"><span>高度</span><b id="telemetry-altitude">--</b></div><div class="telemetry-cell"><span>速度</span><b id="telemetry-speed">--</b></div><div class="telemetry-cell"><span>HDOP</span><b id="telemetry-hdop">--</b></div><div class="telemetry-cell"><span>UTC</span><b id="telemetry-timestamp">--:--:--</b></div></div><div id="map"></div><div class="map-footer"><span>Latest: <b id="latest">--:--:--</b></span><span>OpenStreetMap / Leaflet</span></div></article></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script>
</body>
</html>
